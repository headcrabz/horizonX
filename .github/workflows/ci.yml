name: CI

on:
  push:
    branches: [master, horizonx-init]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check horizonx/ tests/

      - name: Type check
        run: mypy horizonx/ --ignore-missing-imports

      - name: Test
        run: pytest tests/ -q --tb=short
        env:
          ANTHROPIC_API_KEY: ""   # not required for tests

  lint-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check horizonx/ tests/
